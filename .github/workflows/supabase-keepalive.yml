name: Keepalive

# 매일 한 번 Supabase와 챗봇 의존성(/api/health)을 점검합니다.
# - Supabase 무료 플랜의 7일 무쿼리 일시정지를 막고, 챗봇이 실제로 답할 수 있는지 확인합니다.
# - 실패하면 이슈를 만들어 알려줍니다.
# - 공개 저장소는 60일 동안 활동이 없으면 스케줄이 꺼지므로, 성공할 때마다 워크플로우를 다시 활성화합니다.
#
# 저장소 Secrets:  NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, HEALTH_KEY(= Vercel의 CRON_SECRET)
# 저장소 Variables(선택): SITE_URL (기본값 https://nextjs-portpolio.vercel.app)

on:
  schedule:
    - cron: "0 15 * * *" # UTC 15:00 = KST 00:00
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      HEALTH_KEY: ${{ secrets.HEALTH_KEY }}
      SITE_URL: ${{ vars.SITE_URL || 'https://nextjs-portpolio.vercel.app' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Supabase 조회 (읽기 전용, 최소 쿼리)
        run: |
          http_status=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/page_views?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP status: $http_status"
          cat /tmp/resp.json
          if [ "$http_status" -ge 400 ]; then
            echo "::error::Supabase 조회 실패 (status $http_status). 프로젝트가 일시정지됐다면 대시보드에서 Restore 하세요."
            exit 1
          fi

      - name: 챗봇 의존성 점검 (/api/health?deep=1)
        run: |
          auth=()
          if [ -n "$HEALTH_KEY" ]; then auth=(-H "Authorization: Bearer $HEALTH_KEY"); fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${auth[@]}" "$SITE_URL/api/health?deep=1" | tee /tmp/health.json

      - name: 실패 시 이슈 생성
        if: failure()
        run: |
          gh label create keepalive --color B60205 --description "keepalive 점검 실패" --force
          if [ -z "$(gh issue list --label keepalive --state open --json number --jq '.[0].number')" ]; then
            gh issue create --label keepalive \
              --title "Keepalive 점검 실패 ($(date -u +%F))" \
              --body "실행 로그: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      - name: 스케줄 비활성화 방지
        if: success()
        run: gh workflow enable supabase-keepalive.yml --repo "$GITHUB_REPOSITORY"
